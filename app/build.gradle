plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rk.tunnel'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rk.tunnel'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '2.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ["**/libcloudflared.so"]
        }
    }
}
